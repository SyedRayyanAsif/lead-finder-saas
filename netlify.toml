# Netlify build & hosting settings for MarketRay.
# Netlify reads this file automatically - no need to repeat these in its UI.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

  # Netlify scans the built site for the values of your environment variables
  # and FAILS the deploy if it finds one. Vite deliberately copies every
  # VITE_* variable into the browser bundle, so the two Supabase values below
  # would always trip it. They're public by design: the publishable (anon) key
  # is protected by the Row Level Security rules in supabase/schema.sql, not by
  # secrecy.
  #
  # Only these two are exempted; scanning stays on for everything else.
  # NEVER put the Supabase secret key (sb_secret_..., or the old "service_role"
  # key) or any real secret in a VITE_ variable - it would be published to every
  # visitor.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Single-page app: every URL (e.g. /requests/abc, /login) must serve index.html
# so React Router can take over. Real files such as /assets/*.js are still
# served as-is because this rule isn't forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Basic hardening headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
